<!DOCTYPE html>
<html>
<head>
    <title>Simple To-Do App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
        }

        button, a {
            padding: 10px 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .add {
            background: #222;
            color: white;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .actions a {
            margin-left: 5px;
            background: #eee;
            color: black;
        }

        .empty {
            text-align: center;
            color: gray;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>My To-Do List</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.title }}
        <button class="add" type="submit">Add Task</button>
    </form>

    {% for task in tasks %}
        <div class="task">
            <span class="{% if task.completed %}completed{% endif %}">
                {{ task.title }}
            </span>

            <span class="actions">
                {% if not task.completed %}
                    <a href="{% url 'complete' task.id %}">Complete</a>
                {% endif %}
                <a href="{% url 'delete' task.id %}">Delete</a>
            </span>
        </div>
    {% empty %}
        <p class="empty">No tasks yet.</p>
    {% endfor %}
</div>
</body>
</html>
